# নিচের কোডটি কপি করে netlify.toml ফাইলে পেস্ট করো

[build]
  command = "npm run build"
  publish = "dist/spa"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: ব্রাউজার ক্যাশিং কন্ট্রোল
[headers]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"